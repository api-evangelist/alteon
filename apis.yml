name: Alteon
description: >-
  Alteon is Radware's application delivery controller (ADC) and advanced load
  balancer product line, providing Layer 4-7 load balancing, SSL/TLS offloading,
  application acceleration, global server load balancing, and integrated
  application security across on-premises, virtual, and public-cloud
  environments. Originally Alteon WebSystems (a Matrix Partners-backed company
  that IPO'd in 1999 and was later acquired by Nortel), the Alteon product line
  is now developed and supported by Radware. Alteon exposes a device-embedded
  REST API (accessed at https://<device>/restdoc/, HTTP Basic auth, available
  from Alteon 34.0.4 / 33.5.8 / 33.0.12 and above) plus first-party automation
  clients including a Python SDK, a certified Terraform provider, and Ansible
  modules.
